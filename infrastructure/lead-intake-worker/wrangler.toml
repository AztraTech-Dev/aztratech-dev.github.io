name = "aztratech-lead-intake"
main = "src/index.ts"
compatibility_date = "2026-09-23"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "aztratech-leads"
database_id = "d5fe15de-9437-4a7c-a9de-094c36215705"

# Burst protection only (3 requests / 60 seconds per actor key). This does
# NOT provide an hourly quota -- see the D1-backed rolling-hour check in
# src/index.ts for that.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://aztra.tech"
# Best-effort lead notification (Resend). Non-secret addresses only.
NOTIFICATION_RECIPIENT = "vladyslav.usichenko@aztra.tech"
NOTIFICATION_FROM = "AztraTech Leads <leads@notify.aztra.tech>"

# IP_HASH_KEY and RESEND_API_KEY are secrets and are never set here. Local dev:
# infrastructure/lead-intake-worker/.dev.vars (gitignored). Production:
# `wrangler secret put IP_HASH_KEY` / `wrangler secret put RESEND_API_KEY`.
